# Build the native_sim board, package it and test sketches on the host with
# the installed package: the loader tests, and for each board of the core
# artifacts the sketches test_core builds for it, with native_sim posing as
# that board (see the 'mimic' menu in boards.txt), one job per board.
#
# Called by package_core.yml, without waiting for the other boards: it
# needs the build environment (build-env.tar.zstd) of the calling run. It
# fetches the test data and publishes it as test-data for the calling run
# (test_core.yml reuses it). The results are reported by the calling run
# (see ci_collect_data.py) from the test-report-native_sim-* artifacts and
# the job completion markers.

name: Native tests

on:
  workflow_call:
    inputs:
      core-version:
        description: Version of the core being tested
        type: string
        required: true
      core-tag:
        description: Tag or hash of the core being tested, for file names
        type: string
        required: true
      ci-builds-url:
        description: Additional Board Manager index URL for the tools (optional)
        type: string
        default: ''
    outputs:
      matrix:
        description: The native_sim test jobs, see ci_native_sim_matrix.sh
        value: ${{ jobs.build.outputs.MATRIX }}

jobs:

  # Build the native_sim board and package it, then compute the matrix of
  # native_sim test jobs from the test list. The package is never published,
  # it is only tested on the host.

  build:
    name: Build
    runs-on: ubuntu-latest
    outputs:
      # native_sim test jobs, see ci_native_sim_matrix.sh
      MATRIX: ${{ steps.matrix.outputs.MATRIX }}
    env:
      # ccache, don't look for the spec file anywhere
      CCACHE_IGNOREOPTIONS: -specs=*
      # the core .git folder is not archived, use the version computed by build-env
      PINNED_CORE_VERSION: ${{ inputs.core-version }}
      CORE_TAG: ${{ inputs.core-tag }}
      CORE_ARTIFACT: distrib/native_sim.tar.bz2
      # report file stem, as for build-board
      REPORT: reports/zephyr-native_sim_native_64
    steps:

      - uses: actions/download-artifact@v8
        timeout-minutes: 10 # early error on Github network issues
        with:
          path: /home/runner
          name: build-env.tar.zstd

      - name: Restore build environment
        id: restore-env
        timeout-minutes: 5 # early error on Github network issues
        run: |
          sudo apt-get remove --purge man-db -y # skips the mandb triggers
          sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt 2>/dev/null || true # unreliable mirror
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git cmake wget python3-pip ninja-build ccache device-tree-compiler gcc-14 g++-14
          # the SDK libstdc++ headers need gcc 14: make it the default host compiler
          for link in gcc:gcc g++:g++ cc:gcc c++:g++ cpp:cpp ; do
            sudo ln -sf /usr/bin/${link#*:}-14 /usr/local/bin/${link%:*}
          done
          (cd ~ && tar --use-compress-program=unzstd -xpf build-env.tar.zstd && rm build-env.tar.zstd)

      # download the external test repositories once for all the test jobs of
      # this run, as early as possible. See ci_fetch_tests.sh for details.
      - name: Fetch test data
        id: test-data
        continue-on-error: true # reported as a failed test job below
        run: |
          extra/ci_fetch_tests.sh

      - name: Archive test data
        if: ${{ steps.test-data.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: test-data
          path: test-data/
          overwrite: true
          retention-days: 1

      - name: ccache
        uses: actions/cache@v5
        with:
          key: ${{ github.job }} # independent cache
          path: ~/.cache/ccache

      - name: Install host SDK toolchain
        run: |
          # native_sim sketches use the picolibc-based libstdc++ of the host
          # SDK toolchain, which bootstrap.sh does not install
          source venv/bin/activate
          SDK_VERSION=$(jq -r '.toolsDependencies[] | select(.name == "arm-zephyr-eabi") | .version' extra/artifacts/_common.json)
          west sdk install --version $SDK_VERSION -t $(uname -m)-zephyr-elf --no-hosttools

      - name: Build and package native_sim
        shell: bash
        run: |
          mkdir -p reports
          if ! ./extra/build.sh native_sim 1> >(tee $REPORT.stdout) 2> >(tee $REPORT.stderr >&2) ; then
            # build failed, capture errors in summary
            echo "### :x: native_sim build errors" > $GITHUB_STEP_SUMMARY
            echo >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            cat $REPORT.stderr >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          # look for warnings, as build-board does
          grep -i "warning:" $REPORT.stdout > $REPORT.warnings || true
          cp firmwares/zephyr-native_sim_native_64.config $REPORT.config
          ./extra/package_core.sh native_sim ${CORE_TAG} ${CORE_ARTIFACT}

      - name: Archive core package
        uses: actions/upload-artifact@v7
        with:
          name: native_sim-package
          path: ${{ env.CORE_ARTIFACT }}
          overwrite: true
          retention-days: 1

      - name: Archive build reports
        uses: actions/upload-artifact@v7
        with:
          name: build-report-native_sim
          path: |
            ${{ env.REPORT }}.config
            ${{ env.REPORT }}.warnings
          overwrite: true
          retention-days: 1

      - name: Collect test lists
        id: test-list
        if: ${{ steps.test-data.outcome == 'success' }}
        continue-on-error: true # reported as a failed test job below
        run: |
          # the test list of each board native_sim poses as, as test-core
          # selects it for the board package
          extra/ci_native_sim_lists.sh lists/

      - name: Compute test matrix
        id: matrix
        run: |
          mkdir -p lists
          if [ "${{ steps.test-list.outcome }}" == "success" ] ; then
            echo "MATRIX=$(extra/ci_native_sim_matrix.sh lists/)" >> $GITHUB_OUTPUT
          else
            # a job with no sketches, that fails to show the problem
            echo "::error::native_sim test lists not available"
            rm -rf lists && mkdir lists && echo "native_sim test lists not available" > lists/none.txt
            echo "MATRIX=$(extra/ci_native_sim_matrix.sh lists/ |
              jq -c '. + [{ group: "test-list", id: "test-native_sim-test-list" }]')" >> $GITHUB_OUTPUT
          fi

      - name: Archive test list
        uses: actions/upload-artifact@v7
        with:
          name: native_sim-test-list
          path: lists/
          if-no-files-found: error
          overwrite: true
          retention-days: 1

      # publish the outcome of this job for ci_collect_data.py (the action
      # comes with the build environment)
      - name: Mark build as completed
        if: ${{ !cancelled() && steps.restore-env.outcome == 'success' }}
        uses: ./.github/actions/mark-job-completed
        with:
          id: build-native_sim
          retention-days: 1



  # Compile the test sketches of each board with the installed package, one
  # job per board native_sim poses as (see ci_native_sim_matrix.sh), and run
  # the ones that have expect logic on the host. See
  # loader/native_sim/tests/run_sketches.sh.

  test:
    name: Test ${{ matrix.group }}
    runs-on: ubuntu-latest
    needs:
      - build
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          ${{ fromJSON( needs.build.outputs.MATRIX ) }}
      fail-fast: false
    env:
      # the core package, installed as a sketchbook hardware platform, also
      # under the core architecture names (see setup-native-sim)
      CORE_DIR: /home/runner/Arduino/hardware/arduino-git/native_sim
      # native_sim posing as the board, under the board architecture
      FQBN: ${{ matrix.arch && format('arduino-git:{0}:native_sim:mimic={1}', matrix.arch, matrix.group) || 'arduino-git:zephyr:native_sim' }}
      # report of this job, for ci_collect_data.py
      SKETCH_REPORT: ${{ github.workspace }}/native_sim-sketches-${{ matrix.group }}.json
    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-native-sim
        with:
          core-dir: ${{ env.CORE_DIR }}
          ci-builds-url: ${{ inputs.ci-builds-url }}

      - uses: actions/download-artifact@v8
        if: ${{ matrix.group != 'loader' }}
        with:
          name: native_sim-test-list
          path: lists/

      - uses: actions/download-artifact@v8
        if: ${{ matrix.group != 'loader' }}
        continue-on-error: true # no test-data, no sketches: the test fails
        with:
          name: test-data
          path: test-data/

      - name: Prepare test sketches
        if: ${{ matrix.arch }}
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VARIANT: ${{ matrix.variant }}
          GROUP: ${{ matrix.group }}
        run: |
          # extract the fetched repositories of the board into the installed
          # core, as for its test list (ci_apply_tests.sh uses this fixed
          # path); the lists of the build job are used, not the ones written
          # here
          # (nothing to prepare if the lists of the board failed)
          [ ! -f "lists/$GROUP/failed" ] || exit 0
          ln -s $CORE_DIR ArduinoCore-zephyr
          extra/ci_apply_tests.sh "$ARTIFACT" "$VARIANT" "$RUNNER_TEMP/lists"
          sort -u "lists/$GROUP/libraries.txt" | while read -r lib ; do
            arduino-cli lib install "$lib" || echo "::warning::cannot install library '$lib'"
          done

      - name: Run tests
        env:
          GROUP: ${{ matrix.group }}
        run: |
          case "$GROUP" in
            loader)
              loader/native_sim/tests/run_tests.sh ;;
            test-list)
              false ;;
            *)
              if [ -f "lists/$GROUP/failed" ] ; then
                cat "lists/$GROUP/failed"
                echo "::error::The test list of $GROUP failed, see the build job"
                exit 1
              fi
              mapfile -t sketches < "lists/$GROUP/tests.txt"
              loader/native_sim/tests/run_sketches.sh -n ArduinoCore-zephyr \
                -u "lists/$GROUP/unavailable.txt" "${sketches[@]}" ;;
          esac || [ -s "$SKETCH_REPORT" ] # failed sketches are checked below

      # fail early on results that are not known issues, as test-core does
      - name: Check test results
        if: ${{ success() || failure() }}
        env:
          # the known issues of the board native_sim poses as, if any
          MIMIC: ${{ matrix.arch && format('{0} {1}', matrix.group, matrix.variant) || '' }}
        run: |
          extra/ci_check_test_report.py native_sim_native_64 "$SKETCH_REPORT" $MIMIC

      - name: Archive test report
        if: ${{ success() || failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-report-native_sim-${{ matrix.group }}
          path: ${{ env.SKETCH_REPORT }}
          if-no-files-found: ignore
          overwrite: true
          retention-days: 1

      - name: Mark tests as completed
        if: ${{ !cancelled() }}
        uses: ./.github/actions/mark-job-completed
        with:
          id: ${{ matrix.id }}
          retention-days: 1



  # Summarize the results of the native_sim test jobs, as soon as they are
  # all done. See ci_native_sim_summary.py.

  summarize:
    name: Collect
    runs-on: ubuntu-latest
    needs:
      - build
      - test
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    env:
      NATIVE_SIM_MATRIX: ${{ needs.build.outputs.MATRIX }}
    steps:

      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            extra/
            variants/*/known_example_issues*.txt
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v8
        continue-on-error: true # missing reports are listed as failures
        with:
          path: .
          pattern: test-report-native_sim-*
          merge-multiple: true

      - uses: actions/download-artifact@v8
        continue-on-error: true # missing markers are listed as failures
        with:
          path: prereqs/
          pattern: prereq-test-native_sim-*
          merge-multiple: true

      - name: Write summary
        shell: bash # with pipefail: the job fails if any test job failed
        run: |
          extra/ci_native_sim_summary.py | tee -a $GITHUB_STEP_SUMMARY
